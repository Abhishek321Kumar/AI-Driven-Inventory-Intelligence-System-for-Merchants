    <filter id="noise4k">

  <!-- Interactive Audio-Haptic Feedback Sound Synthesizer -->
  <script>
    const HapticAudio = (function() {
      let ctx = null;
      let muted = false;
      function getContext() {
        if (!ctx && (window.AudioContext || window.webkitAudioContext)) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      return {
        toggleMute: function() {
          muted = !muted;
          return muted;
        },
        isMuted: function() { return muted; },
        click: function(freq = 1150) {
          if (muted) return;
          try {
            const ac = getContext();
            if (!ac) return;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(320, ac.currentTime + 0.035);
            gain.gain.setValueAtTime(0.06, ac.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.035);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start();
            osc.stop(ac.currentTime + 0.035);
          } catch(e) {}
        },
        chime: function() {
          if (muted) return;
          try {
            const ac = getContext();
            if (!ac) return;
            [659.25, 880, 1318.51].forEach((freq, i) => {
              const osc = ac.createOscillator();
              const gain = ac.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, ac.currentTime + i * 0.05);
              gain.gain.setValueAtTime(0.05, ac.currentTime + i * 0.05);
              gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.05 + 0.1);
              osc.connect(gain);
              gain.connect(ac.destination);
              osc.start(ac.currentTime + i * 0.05);
              osc.stop(ac.currentTime + i * 0.05 + 0.1);
            });
          } catch(e) {}
        }
      };
    })();
  </script>

  <script>
    const M = window.Mercura;
    let currentFrame = "home";
    let jacketDiscountPreview = false;

    // Toast helper
    function showToast(msg, icon = 'bolt') {
      const toast = document.getElementById('toast-pill');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      if (!toast) return;
      toastMsg.textContent = msg;
      toastIcon.textContent = icon;
      toast.classList.add('active');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toast.classList.remove('active');
      }, 3000);
    }

    // Confetti helper
    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 65,
          spread: 55,
          origin: { y: 0.8 },
          colors: ['#D4AF37', '#0EA5A0', '#0B1F2A']
        });
      }
    }

    // Frame Switching Controller
    function switchFrame(frameName) {
      if (!frameName) return;
      currentFrame = frameName;
      HapticAudio.click(1050);

      // Update sidebar nav active styling (Deep Navy + Gold Active Tab)
      document.querySelectorAll('.frame-nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-frame');
        const icon = btn.querySelector('.material-symbols-outlined');
        if (target === frameName) {
          btn.className = "frame-nav-btn sidebar-item group w-full px-2.5 py-2 rounded-r-xl text-xs font-medium flex items-center justify-between transition-all bg-gradient-to-r from-[#D4AF37]/20 via-[#D4AF37]/5 to-transparent text-[#D4AF37] border-l-[3px] border-[#D4AF37] font-semibold shadow-[inset_0_1px_0_rgba(212,175,55,0.15)]";
          if (icon) icon.className = "material-symbols-outlined text-[17px] text-[#D4AF37]";
        } else {
          btn.className = "frame-nav-btn sidebar-item group w-full px-2.5 py-2 rounded-xl text-xs font-medium flex items-center justify-between transition-all hover:bg-white/[0.05] text-stone-300 hover:text-white";
          if (icon) icon.className = "material-symbols-outlined text-[17px]";
        }
      });

      // Swap view frames cleanly with Framer Motion transition
      document.querySelectorAll('.view-frame').forEach(f => {
        f.classList.remove('view-active');
      });

      const activeEl = document.getElementById(`frame-${frameName}`);
      if (activeEl) {
        activeEl.classList.add('view-active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (frameName === 'home') {
          setTimeout(() => {
            if (window.initHomeScrollTrigger) window.initHomeScrollTrigger();
            if (window.ScrollTrigger) ScrollTrigger.refresh();
          }, 80);
        }
      }
    }

    // Home Cash Recovery Live Calculator
    window.updateHomeRecoveryCalc = function(discountVal) {
      const pct = parseInt(discountVal, 10) || 15;
      const pctEl = document.getElementById('home-calc-pct');
      const cashEl = document.getElementById('home-calc-cash');
      const reinvestEl = document.getElementById('home-calc-reinvest');
      const daysEl = document.getElementById('home-calc-days');

      if (pctEl) pctEl.textContent = `${pct}% OFF`;

      // Trapped capital is ₹72,000 across slow SKUs
      const baseRecovered = Math.round(72000 * (0.33 + (pct - 10) * 0.022));
      const unitsReinvested = Math.round(baseRecovered / 1100);
      const days = Math.max(5, Math.round(28 - (pct - 10) * 1.4));

      if (cashEl) cashEl.textContent = window.Mercura ? window.Mercura.inr(baseRecovered) : `₹${baseRecovered.toLocaleString('en-IN')}`;
      if (reinvestEl) reinvestEl.textContent = `+${unitsReinvested} Footwear Units`;
      if (daysEl) daysEl.textContent = `${days} Days vs 90+ Stagnant`;
      if (window.HapticAudio) window.HapticAudio.click(900);
    };

    // GSAP + ScrollTrigger Product Introduction Choreography
    window.initHomeScrollTrigger = function() {
      if (typeof gsap === 'undefined') return;

      if (window.ScrollTrigger) {
        try {
          gsap.registerPlugin(ScrollTrigger);
        } catch (e) {
          console.warn('ScrollTrigger register notice:', e);
        }
      }

      // 1. Kinetic Hero Typography Staggered Reveal
      gsap.fromTo('.hero-kinetic-title span', 
        { y: 35, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.9, stagger: 0.16, ease: 'power3.out' }
      );

      gsap.fromTo('.hero-kinetic-sub', 
        { y: 20, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.8, delay: 0.32, ease: 'power2.out' }
      );

      // 2. Overlaid Capital Guardrail Parallax & Curved Slogan GSAP Enhancement
      const guardrailEl = document.querySelector('#hero-guardrail-card');
      if (guardrailEl && window.ScrollTrigger) {
        gsap.to(guardrailEl, {
          y: -18,
          scrollTrigger: {
            trigger: guardrailEl,
            start: 'top bottom',
            end: 'bottom top',
            scrub: 1.2
          }
        });
      }

      const sloganTextEl = document.querySelector('#sloganTextPath');
      if (sloganTextEl && !sloganTextEl.querySelector('animate') && window.gsap) {
        gsap.fromTo(sloganTextEl, 
          { attr: { startOffset: '0%' } },
          { attr: { startOffset: '12.5%' }, duration: 12, ease: 'none', repeat: -1 }
        );
      }

      // 3. Connected 6-Stage AI Loop: Sequential Pipeline Light-up
      if (window.ScrollTrigger) {
        gsap.fromTo('.loop-step-card', 
          { y: 25, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.5,
            stagger: 0.1,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: '#home-section-loop',
              start: 'top 80%',
              once: true
            }
          }
        );
      }
    };

    // Initialize Home Storytelling when DOM loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initHomeScrollTrigger, 120);
      });
    } else {
      setTimeout(initHomeScrollTrigger, 120);
    }

    // Attach click listeners to sidebar buttons
    document.querySelectorAll('.frame-nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchFrame(btn.getAttribute('data-frame'));
      });
    });

    // Jacket Clearance Preview Toggle (Affects Dashboard & Cash Flow)
    function adjustProcurement(sku) {
      const store = window.MercuraStore;
      if (!store) return;
      const on = !(store.state.locked && store.state.locked[sku]);
      store.setLocked(sku, on);
      HapticAudio.click();
      showToast(on ? "Pending purchase order cancelled." : "Pending purchase order restored.");
    }

    function viewProductAnalysis(sku) {
      const panel = document.getElementById("ins-analysis");
      if (!panel) return;
      const same = panel.dataset.sku === sku && !panel.classList.contains("hidden");
      panel.dataset.sku = sku;
      panel.classList.toggle("hidden", same);
      if (!same && window.MercuraStore) window.MercuraStore.renderInsightCards(window.Mercura.catalog(window.MercuraStore.engineActions()));
      if (!same) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function toggleJacketClearance() {
      const on = !(window.MercuraStore && window.MercuraStore.state.clearance && window.MercuraStore.state.clearance['JKT-409']);
      jacketDiscountPreview = on;
      if (window.MercuraStore) window.MercuraStore.setClearance('JKT-409', on);
      if (on) {
        HapticAudio.chime();
        fireConfetti();
        showToast("15% clearance preview applied. No purchase order was sent.", "bolt");
      } else {
        HapticAudio.click();
        showToast("Clearance preview reverted.", "undo");
      }
    }

    // Supplier Note Clipboard Copy
    function copySupplierNote(skuId) {
      let text = "";
      if (window.Mercura && window.MercuraStore) {
        const sku = window.Mercura.catalog(window.MercuraStore.engineActions()).find(s => s.id === skuId);
        if (sku) text = window.Mercura.orderNote(sku);
      }
      text = text || "Sharma Apparels reorder note.";
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      HapticAudio.click(1300);
      showToast(`📋 Supplier PO note copied for #${skuId}!`, "content_copy");
    }

    // Alert Reviewed handlers
    function markAlertReviewed(btn) {
      btn.textContent = "✓ Reviewed";
      btn.className = "text-[10px] font-bold text-[#0EA5A0]";
      HapticAudio.click();
      showToast("Alert marked as reviewed.", "check_circle");
    }

    function reviewAllAlerts() {
      document.querySelectorAll('#frame-alerts button').forEach(b => {
        if (b.textContent.includes('Mark Reviewed')) {
          b.textContent = "✓ Reviewed";
          b.className = "text-[10px] font-bold text-[#0EA5A0]";
        }
      });
      const unreviewedEl = document.getElementById('alert-unreviewed-kpi');
      if (unreviewedEl) unreviewedEl.textContent = "0 New";
      HapticAudio.chime();
      showToast("All visible alerts marked as reviewed.", "done_all");
    }

    // Dashboard Channel Switcher Pills
    document.querySelectorAll('.dash-chan-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dash-chan-btn').forEach(b => {
          b.className = "dash-chan-btn px-2.5 py-1 rounded-lg text-xs font-medium text-stone-300 hover:text-white";
        });
        btn.className = "dash-chan-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-[#D4AF37] text-[#0B1F2A] shadow-xs";
        
        const chan = btn.getAttribute('data-chan');
        if (window.MercuraStore) window.MercuraStore.setChannel(chan);
        HapticAudio.click();
      });
    });

    // Inventory Table Filter Chips
    document.querySelectorAll('.inv-filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.inv-filter-chip').forEach(c => {
          c.className = "inv-filter-chip px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-[#4B5563] hover:text-[#0B1F2A]";
        });
        chip.className = "inv-filter-chip px-2.5 py-1 rounded-lg bg-[#0B1F2A] text-white font-bold";
        
        if (window.MercuraStore) window.MercuraStore.renderTableRows();
        HapticAudio.click();
      });
    });

    // Inventory Search Input
    const invSearch = document.getElementById('inv-search-input');
    if (invSearch) {
      invSearch.addEventListener('input', () => {
        if (window.MercuraStore) window.MercuraStore.renderTableRows();
      });
    }

    // Top Global Search Input
    const topSearch = document.getElementById('top-search-bar');
    if (topSearch) {
      topSearch.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          switchFrame('inventory');
          const term = topSearch.value;
          if (invSearch) {
            invSearch.value = term;
            invSearch.dispatchEvent(new Event('input'));
          }
          showToast(`Filtered inventory for "${term}"`, 'search');
        }
      });
    }

    // Sidebar Collapse / Expand Toggle
    const sidebar = document.getElementById('app-sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('sidebar-collapsed');
        HapticAudio.click();
      });
    }

    // Store Switcher Dropdown Popover
    const storeBtn = document.getElementById('store-switcher-btn');
    const storePop = document.getElementById('store-popover');
    if (storeBtn && storePop) {
      storeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        storePop.classList.toggle('hidden');
        HapticAudio.click();
      });
      document.addEventListener('click', () => {
        storePop.classList.add('hidden');
      });
    }

    // Cmd+K Search Modal
    const cmdkModal = document.getElementById('cmdk-modal');
    const searchBtn = document.getElementById('sidebar-search-btn');
    const cmdkInput = document.getElementById('cmdk-input');

    function openCmdK() {
      cmdkModal.classList.remove('hidden');
      cmdkInput.value = '';
      cmdkInput.focus();
      HapticAudio.click(1200);
    }

    function closeCmdK() {
      cmdkModal.classList.add('hidden');
    }

    if (searchBtn) searchBtn.addEventListener('click', openCmdK);
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openCmdK();
      }
      if (e.key === 'Escape') {
        closeCmdK();
      }
      if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        if (topSearch) {
          topSearch.focus();
          topSearch.select();
        }
      }
    });

    // Sound toggle in top header
    const soundBtn = document.getElementById('top-sound-btn');
    if (soundBtn) {
      soundBtn.addEventListener('click', () => {
        const muted = HapticAudio.toggleMute();
        soundBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">${muted ? 'volume_off' : 'volume_up'}</span>`;
        showToast(muted ? "Sound Muted" : "Haptics Active 🔊", muted ? "volume_off" : "volume_up");
        if (!muted) HapticAudio.click();
      });
    }

    // Global tactile click sound for buttons & links
    document.addEventListener('click', (e) => {
      if (e.target.closest('button, input[type="checkbox"]')) {
        HapticAudio.click(1100);
      }
    });
  </script>

</body>
</html>
